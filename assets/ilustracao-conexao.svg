<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Duas pessoas em conversa ligadas por ondas de comunicação">
  <defs>
    <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B87333"/>
      <stop offset="50%" stop-color="#F0D68C"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="50%" cy="46%" r="45%">
      <stop offset="0" stop-color="#D9B451" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#D9B451" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="#070B16"/>
  <ellipse cx="200" cy="230" rx="180" ry="150" fill="url(#cGlow)"/>

  <!-- perfil esquerdo -->
  <g stroke="#D9B451" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M28 430v-78c-12-10-20-25-23-42-3-14-1-29 5-42 16-38 54-63 96-61"/>
    <path d="M22 262c-6 4-10 9-11 16-1 6 1 12 5 16l9 6"/>
  </g>
  <circle cx="48" cy="258" r="3.6" fill="#F0D68C"/>

  <!-- perfil direito (espelhado) -->
  <g stroke="#D9B451" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M372 430v-78c12-10 20-25 23-42 3-14 1-29-5-42-16-38-54-63-96-61"/>
    <path d="M378 262c6 4 10 9 11 16 1 6-1 12-5 16l-9 6"/>
  </g>
  <circle cx="352" cy="258" r="3.6" fill="#F0D68C"/>

  <!-- ondas de comunicação entre os dois -->
  <g fill="none" stroke="url(#cGold)" stroke-linecap="round">
    <path d="M120 250c14-30 26-30 40 0s26 30 40 0 26-30 40 0 26 30 40 0" stroke-width="2.4" opacity=".95"/>
    <path d="M124 208c12-22 22-22 34 0s22 22 34 0 22-22 34 0 22 22 34 0" stroke-width="1.5" opacity=".5"/>
    <path d="M124 292c12 22 22 22 34 0s22-22 34 0 22 22 34 0 22-22 34 0" stroke-width="1.5" opacity=".5"/>
  </g>

  <!-- nós de ligação -->
  <g fill="#F0D68C">
    <circle cx="120" cy="250" r="5"/><circle cx="200" cy="250" r="6.5"/><circle cx="280" cy="250" r="5"/>
  </g>
  <circle cx="200" cy="250" r="16" fill="none" stroke="#D9B451" stroke-width="1.2" opacity=".55"/>
  <circle cx="200" cy="250" r="28" fill="none" stroke="#D9B451" stroke-width="1" opacity=".3"/>

  <g fill="#D9B451" opacity=".35">
    <circle cx="94" cy="118" r="1.8"/><circle cx="306" cy="110" r="1.6"/><circle cx="200" cy="86" r="2"/>
    <circle cx="140" cy="398" r="1.6"/><circle cx="262" cy="404" r="1.8"/>
  </g>
</svg>
