<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 400 500" role="img" aria-label="Apólice assinada com selo de confirmação e curva de resultados ascendente">
  <defs>
    <linearGradient id="aGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D68C"/>
      <stop offset="60%" stop-color="#D9B451"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <linearGradient id="aCurve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B87333"/>
      <stop offset="55%" stop-color="#D9B451"/>
      <stop offset="100%" stop-color="#F0D68C"/>
    </linearGradient>
    <radialGradient id="aGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0" stop-color="#D9B451" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#D9B451" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="-20" width="400" height="500" fill="#070B16"/>
  <ellipse cx="200" cy="210" rx="176" ry="150" fill="url(#aGlow)"/>

  <!-- curva ascendente de resultados -->
  <path d="M46 196 C110 190 130 150 172 124 C214 98 250 100 300 62"
        fill="none" stroke="url(#aCurve)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M286 62h20v20" fill="none" stroke="#F0D68C" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F0D68C">
    <circle cx="46" cy="196" r="4"/><circle cx="172" cy="124" r="5"/><circle cx="300" cy="62" r="5.5"/>
  </g>
  <g stroke="#D9B451" stroke-width="1" opacity=".3" stroke-dasharray="3 6">
    <path d="M46 196v56M172 124v128M300 62v190"/>
  </g>

  <!-- apólice -->
  <g opacity=".95">
    <path d="M96 252h208v168H96z" fill="#0A1020" stroke="url(#aGold)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M96 252h208v26H96z" fill="#D9B451" fill-opacity=".14" stroke="url(#aGold)" stroke-width="1.4"/>
    <g stroke="#D9B451" stroke-width="1.6" stroke-linecap="round" opacity=".7">
      <path d="M120 306h118M120 330h118M120 354h74"/>
    </g>
  </g>

  <!-- assinatura -->
  <path d="M120 392c14-16 24-10 30 0s14 14 26 0 20-8 26 2" fill="none"
        stroke="#F0D68C" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M112 404h104" stroke="#D9B451" stroke-width="1" opacity=".45"/>

  <!-- selo de confirmação -->
  <g transform="translate(266 372)">
    <circle r="30" fill="#070B16" stroke="url(#aGold)" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#D9B451" stroke-width="1" opacity=".5" stroke-dasharray="3 5"/>
    <path d="M-11 1l8 9 15-18" fill="none" stroke="#F0D68C" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#D9B451" opacity=".32">
    <circle cx="64" cy="86" r="1.8"/><circle cx="348" cy="150" r="1.6"/>
    <circle cx="52" cy="318" r="1.6"/><circle cx="356" cy="300" r="1.8"/>
  </g>
</svg>
